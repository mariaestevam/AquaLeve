spring.application.name=AquaLeve

# Configure as credenciais por variáveis de ambiente; não publique senhas no GitHub.
spring.datasource.url=${AQUALEVE_DB_URL:jdbc:postgresql://localhost:5432/bdaqualeve}
spring.datasource.username=${AQUALEVE_DB_USER:postgres}
spring.datasource.password=${AQUALEVE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
server.port=${PORT:8080}

# Os perfis são verificados pelo Spring Security, não por este arquivo.
aqualeve.jwt.secret=${AQUALEVE_JWT_SECRET}
aqualeve.admin.email=${AQUALEVE_ADMIN_EMAIL:}
aqualeve.admin.senha=${AQUALEVE_ADMIN_SENHA:}
aqualeve.cookie.secure=${AQUALEVE_COOKIE_SECURE:false}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
