<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Novo administrador')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: menu('admin')}"></header>
<div th:replace="~{fragmentos/layout :: mensagens}"></div>

<main class="container pagina-estreita">
    <a class="voltar" th:href="@{/administradores}"><svg class="i"><use href="#i-arrow-left"/></svg>Administradores</a>
    <div class="form-card largo" style="margin-top:8px">
        <div class="topo-form">
            <svg class="i i-xl cor-agua" style="margin:0 auto 12px"><use href="#i-user-cog"/></svg>
            <h1>Novo administrador</h1>
            <p>Quem for cadastrado aqui poderá gerenciar prainhas, datas, eventos e reservas.</p>
        </div>

        <div class="msg erro" th:if="${erro}"><svg class="i"><use href="#i-circle-alert"/></svg><span th:text="${erro}">Erro</span></div>

        <form th:action="@{/administradores/salvar}" th:object="${administradorForm}" method="post" novalidate>
            <div class="campo" th:classappend="${#fields.hasErrors('nome')} ? 'com-erro'">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" th:field="*{nome}">
                <small class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
            </div>
            <div class="linha-form">
                <div class="campo" th:classappend="${#fields.hasErrors('telefone')} ? 'com-erro'">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" th:field="*{telefone}" inputmode="tel">
                    <small class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></small>
                </div>
                <div class="campo" th:classappend="${#fields.hasErrors('email')} ? 'com-erro'">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" th:field="*{email}">
                    <small class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                </div>
            </div>
            <div class="linha-form">
                <div class="campo" th:classappend="${#fields.hasErrors('senha')} ? 'com-erro'">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" th:field="*{senha}" autocomplete="new-password" placeholder="Pelo menos 8 caracteres">
                    <small class="erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></small>
                </div>
                <div class="campo" th:classappend="${#fields.hasErrors('confirmarSenha')} ? 'com-erro'">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" th:field="*{confirmarSenha}" autocomplete="new-password">
                    <small class="erro-campo" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></small>
                </div>
            </div>
            <div class="acoes-form">
                <a class="btn btn-outline btn-lg" th:href="@{/administradores}">Cancelar</a>
                <button class="btn btn-lg" type="submit"><svg class="i"><use href="#i-clipboard-check"/></svg>Salvar cadastro</button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
