<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: cabecalho('Página não encontrada')}"></head>
<body>
<header th:replace="~{fragmentos/layout :: menu('erro')}"></header>

<main class="container">
    <div class="erro-pagina">
        <svg class="i i-2xl cor-agua" style="margin:0 auto 16px"><use href="#i-waves"/></svg>
        <div class="codigo" th:text="${status}">404</div>
        <h1 th:text="${status == 413 ? 'Imagem muito grande' : 'Página não encontrada ou indisponível'}">Página indisponível</h1>
        <p th:text="${status == 413 ? 'Envie uma foto JPEG ou PNG de até 5 MB. Volte ao formulário para tentar novamente.' : 'Confira o endereço ou volte para o início.'}">Confira o endereço ou volte para o início.</p>
        <a class="btn" th:href="@{/}"><svg class="i"><use href="#i-arrow-left"/></svg>Voltar ao início</a>
    </div>
</main>

<footer th:replace="~{fragmentos/layout :: rodape}"></footer>
</body>
</html>
